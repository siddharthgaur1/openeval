[project]
name = "openeval-sdk"
version = "0.1.0"
description = "Python SDK for OpenEval - auto-log LLM calls (prompt, response, latency, tokens, cost)"
requires-python = ">=3.10"
dependencies = ["litellm>=1.52.0", "httpx>=0.27.0"]

[tool.setuptools]
py-modules = ["client"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
