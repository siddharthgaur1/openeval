name: Eval on PR

on:
  pull_request:

jobs:
  eval:
    # The eval needs a reachable OpenEval backend and a dataset to run against.
    # Neither is configured on every fork or clone of this repo, and without them
    # the job failed every pull request on an empty API response. Skip when the
    # deployment is not configured; run it wherever it is.
    if: vars.OPENEVAL_API_URL != '' && vars.OPENEVAL_DATASET_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-eval
        with:
          api-url: ${{ vars.OPENEVAL_API_URL }}
          api-key: ${{ secrets.OPENEVAL_API_KEY }}
          dataset-id: ${{ vars.OPENEVAL_DATASET_ID }}
          target-model: ${{ vars.OPENEVAL_TARGET_MODEL }}
