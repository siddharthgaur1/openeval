services:
  - type: web
    name: openeval-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # No dockerCommand: Render splits it on whitespace with no shell and no
    # quote-awareness, so any multi-command string (migration + backgrounded
    # worker + server) breaks. The startup logic lives in
    # backend/start.sh + Dockerfile's CMD instead, where normal shell/Docker
    # semantics apply.
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JUDGE_MODEL
        value: groq/llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: openeval-frontend
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
