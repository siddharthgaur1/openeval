services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openeval
      POSTGRES_PASSWORD: openeval
      POSTGRES_DB: openeval
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openeval"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://openeval:openeval@postgres:5432/openeval
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"

  celery-worker:
    build: ../backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://openeval:openeval@postgres:5432/openeval
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workers.celery_app worker --loglevel=info -Q evals

  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Optional: zero-code tracing. Point any OpenAI-compatible client's base_url at
  # this proxy instead of the real provider and every call is auto-traced to
  # OpenEval - no SDK needed. Off by default; `docker compose --profile proxy up`
  # to include it. Requires OPENEVAL_API_KEY (and your provider keys) in .env.
  litellm-proxy:
    build: ./litellm-proxy
    profiles: ["proxy"]
    env_file: .env
    environment:
      OPENEVAL_API_URL: http://backend:8000
    ports:
      - "4000:4000"
    depends_on:
      - backend

volumes:
  postgres_data:
