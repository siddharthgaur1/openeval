# Template only - do not apply this file as-is or commit real values into it.
#
# Copy it, fill in real values, and apply the copy (or generate the Secret with
# `kubectl create secret generic openeval-secrets --from-literal=...` instead of
# committing a manifest at all). In a real cluster, prefer a secrets manager
# integration (Sealed Secrets, External Secrets Operator, SOPS) over a plain
# `kubectl apply` of stringData - this file exists to document which keys
# backend-deployment.yaml and worker/deployment.yaml expect via envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: openeval-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql://openeval:REPLACE_ME@your-postgres-host:5432/openeval
  REDIS_URL: redis://your-redis-host:6379/0
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(48))"
  JWT_SECRET: REPLACE_ME
  # Optional - only needed if you use an LLM-judge metric or synthetic data
  # generation against a paid provider instead of a local Ollama model.
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
